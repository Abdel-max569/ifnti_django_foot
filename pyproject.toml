[project]
name = "tournoi-foot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
